<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Agent 调试仪表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #28a745;
        }
        
        .status-card.warning {
            border-left-color: #ffc107;
        }
        
        .status-card.error {
            border-left-color: #dc3545;
        }
        
        .status-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .status-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .status-label {
            font-weight: 500;
            color: #555;
        }
        
        .status-value {
            font-weight: bold;
            color: #333;
        }
        
        .status-ok {
            color: #28a745;
        }
        
        .status-warning {
            color: #ffc107;
        }
        
        .status-error {
            color: #dc3545;
        }
        
        .debug-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        
        .debug-link {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            font-weight: 500;
        }
        
        .debug-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            color: white;
            text-decoration: none;
        }
        
        .debug-link h4 {
            margin-bottom: 8px;
            font-size: 1.2em;
        }
        
        .debug-link p {
            opacity: 0.9;
            font-size: 0.9em;
        }
        
        .refresh-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
            transition: background 0.3s ease;
        }
        
        .refresh-btn:hover {
            background: #218838;
        }
        
        .timestamp {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Remote Agent</h1>
            <p>智能订单处理系统 - 调试仪表板</p>
        </div>
        
        <div class="content">
            <button class="refresh-btn" onclick="refreshStatus()">🔄 刷新状态</button>
            
            <div id="status-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在加载系统状态...</p>
                </div>
            </div>
            
            <div class="debug-links">
                <a href="http://localhost:8000/docs" target="_blank" class="debug-link">
                    <h4>📚 API 文档</h4>
                    <p>Swagger UI 交互式 API 文档</p>
                </a>
                
                <a href="http://localhost:8000/redoc" target="_blank" class="debug-link">
                    <h4>📖 ReDoc 文档</h4>
                    <p>美观的 API 文档界面</p>
                </a>
                
                <a href="http://localhost:8000/openapi.json" target="_blank" class="debug-link">
                    <h4>🔧 OpenAPI 规范</h4>
                    <p>JSON 格式的 API 规范</p>
                </a>
                
                <a href="http://localhost:8000/health" target="_blank" class="debug-link">
                    <h4>💚 健康检查</h4>
                    <p>系统健康状态监控</p>
                </a>
                
                <a href="javascript:void(0)" onclick="createTestOrder()" class="debug-link">
                    <h4>🧪 创建测试订单</h4>
                    <p>快速创建测试订单</p>
                </a>
                
                <a href="javascript:void(0)" onclick="showPerformanceTest()" class="debug-link">
                    <h4>📈 性能测试</h4>
                    <p>API 响应时间测试</p>
                </a>
            </div>
            
            <div class="timestamp" id="timestamp">
                最后更新: 加载中...
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000';
        
        async function fetchWithTimeout(url, timeout = 5000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);
            
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                throw error;
            }
        }
        
        async function refreshStatus() {
            const container = document.getElementById('status-container');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在刷新系统状态...</p>
                </div>
            `;
            
            try {
                // 并行获取所有状态
                const [healthResponse, inventoryResponses] = await Promise.all([
                    fetchWithTimeout(`${BASE_URL}/health`),
                    Promise.all([
                        fetchWithTimeout(`${BASE_URL}/inventory/prod001`),
                        fetchWithTimeout(`${BASE_URL}/inventory/prod002`),
                        fetchWithTimeout(`${BASE_URL}/inventory/prod003`)
                    ])
                ]);
                
                const healthData = await healthResponse.json();
                const inventoryData = await Promise.all(
                    inventoryResponses.map(r => r.json())
                );
                
                displayStatus(healthData, inventoryData);
                
            } catch (error) {
                container.innerHTML = `
                    <div class="status-card error">
                        <h3>❌ 连接错误</h3>
                        <p>无法连接到 Remote Agent 服务</p>
                        <p>请确保服务正在运行: <code>uvicorn app.main:app --reload --host 0.0.0.0 --port 8000</code></p>
                    </div>
                `;
            }
            
            document.getElementById('timestamp').textContent = 
                `最后更新: ${new Date().toLocaleString('zh-CN')}`;
        }
        
        function displayStatus(healthData, inventoryData) {
            const container = document.getElementById('status-container');
            const isHealthy = healthData.status === 'healthy';
            
            container.innerHTML = `
                <div class="status-grid">
                    <div class="status-card ${isHealthy ? '' : 'error'}">
                        <h3>🏥 系统健康状态</h3>
                        <div class="status-item">
                            <span class="status-label">总体状态</span>
                            <span class="status-value ${isHealthy ? 'status-ok' : 'status-error'}">
                                ${isHealthy ? '✅ 健康' : '❌ 异常'}
                            </span>
                        </div>
                        ${Object.entries(healthData.services || {}).map(([service, status]) => `
                            <div class="status-item">
                                <span class="status-label">${service}</span>
                                <span class="status-value ${status ? 'status-ok' : 'status-error'}">
                                    ${status ? '✅ 正常' : '❌ 异常'}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="status-card">
                        <h3>📦 库存状态</h3>
                        ${inventoryData.map(item => `
                            <div class="status-item">
                                <span class="status-label">${item.product_name}</span>
                                <span class="status-value">
                                    可用: ${item.available_quantity} | 预留: ${item.reserved_quantity}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        async function createTestOrder() {
            try {
                const response = await fetch(`${BASE_URL}/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customer_id: 'debug_user_' + Date.now(),
                        items: [
                            { product_id: 'prod001', quantity: 1 }
                        ],
                        delivery_address: '调试测试地址',
                        notes: '调试页面测试订单'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert(`✅ 测试订单创建成功！\n订单ID: ${data.order_id}\n金额: ¥${data.total_amount}`);
                    refreshStatus(); // 刷新状态以显示库存变化
                } else {
                    alert(`❌ 订单创建失败: ${data.detail || '未知错误'}`);
                }
            } catch (error) {
                alert(`❌ 网络错误: ${error.message}`);
            }
        }
        
        async function showPerformanceTest() {
            const startTime = Date.now();
            const endpoints = [
                { name: '健康检查', url: '/health' },
                { name: '库存查询', url: '/inventory/prod001' },
                { name: '动态定价', url: '/pricing/prod001' }
            ];
            
            let results = '📈 性能测试结果:\n\n';
            
            for (const endpoint of endpoints) {
                try {
                    const testStart = Date.now();
                    const response = await fetchWithTimeout(`${BASE_URL}${endpoint.url}`);
                    const testEnd = Date.now();
                    const responseTime = testEnd - testStart;
                    
                    results += `✅ ${endpoint.name}: ${responseTime}ms\n`;
                } catch (error) {
                    results += `❌ ${endpoint.name}: 错误\n`;
                }
            }
            
            const totalTime = Date.now() - startTime;
            results += `\n总耗时: ${totalTime}ms`;
            
            alert(results);
        }
        
        // 页面加载时自动刷新状态
        document.addEventListener('DOMContentLoaded', refreshStatus);
        
        // 每30秒自动刷新一次
        setInterval(refreshStatus, 30000);
    </script>
</body>
</html>
